<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora de IMC</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">
        <div class="colunaEsquerda">
            <section>

                <h1 id="titulo">Calculadora de IMC</h1>

                <p>Cadastre uma pessoa e calcule seu IMC</p>

                <label for="nome">Nome:</label>

                <input
                    type="text"
                    id="nome"
                    placeholder="Ex: Andrey Canalli"
                >
                
                <label for="peso">Peso (kg)</label>

                <input
                    type="number"
                    id="peso"
                    placeholder="Ex: 70"
                >

                <label for="altura">Altura (cm)</label>

                <input
                    type="number"
                    id="altura"
                    placeholder="Ex: 170"
                >

                <div class="botoes">

                    <button id="btnCalcular">
                        Calcular IMC
                    </button>

                    <button id="btnLimpar">
                        Limpar
                    </button>

                </div>
                <div>

                    <h2>Resultado</h2>

                    <div id="resultado"></div>

                </div>
            </section>

            <section class="secaoEstatisticas">

                <h2>Estatísticas</h2>

                <div class="estatisticas">

                    <p id="contadorPessoas">
                        Pessoas cadastradas: 0
                    </p>

                    <p id="maiorIMC">
                        Maior IMC: 0
                    </p>

                    <p id="menorIMC">
                        Menor IMC: 0
                    </p>

                    <p id="mediaIMC">
                        Média dos IMCs: 0
                    </p>
                </div>
            </section>

        </div>

        <section class="secaoLista">

            <h2>Pessoas Cadastradas</h2>

            <input
                type="text"
                id="pesquisa"
                placeholder="Pesquisar pessoa..."
            >

            <div id="listaPessoas">

                <p>
                    Não há pessoas cadastradas.
                </p>
            </div>
        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
